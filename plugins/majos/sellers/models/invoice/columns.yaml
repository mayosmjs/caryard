# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: ID
        type: number
        searchable: true
        sortable: true
        width: 60px

    invoice_number:
        label: Invoice Number
        type: text
        searchable: true
        sortable: true
        width: 150px

    transaction_id:
        label: Transaction ID
        type: number
        searchable: true
        sortable: true
        relation: transaction
        select: id
        width: 100px

    transaction_ref:
        label: Transaction Ref
        type: text
        searchable: true
        sortable: true
        relation: transaction
        select: transaction_id
        width: 180px

    subscription_id:
        label: Subscription ID
        type: number
        searchable: true
        sortable: true
        relation: subscription
        select: id
        width: 100px

    seller_name:
        label: Seller
        type: text
        searchable: false
        sortable: false
        valueFrom: seller_name
        width: 180px

    plan_name:
        label: Plan
        type: text
        searchable: false
        sortable: false
        valueFrom: plan_name
        width: 150px

    amount:
        label: Amount
        type: text
        searchable: true
        sortable: true
        width: 120px

    currency:
        label: Currency
        type: text
        searchable: true
        sortable: true
        width: 80px

    status:
        label: Status
        type: text
        searchable: true
        sortable: true
        width: 100px

    description:
        label: Description
        type: text
        searchable: true
        sortable: false
        width: 200px

    created_at:
        label: Date Created
        type: date
        sortable: true
        width: 150px
        format: "M j, Y"

    view_invoice:
        label: View
        type: partial
        path: $/majos/sellers/partials/_view_invoice.htm
        width: 60px

    resend_email:
        label: Resend Email
        type: partial
        path: $/majos/sellers/partials/_resend_email.htm
        width: 120px
