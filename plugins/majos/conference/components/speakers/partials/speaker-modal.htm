<div id="speakerProfileModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm transition-opacity duration-300 opacity-0 pointer-events-none" aria-hidden="true">
    <div class="relative w-full max-w-4xl mx-4 my-8">
        <!-- Close button -->
        <button type="button" class="absolute -top-12 right-0 text-white/70 hover:text-white transition-colors" aria-label="Close modal">
            <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
        
        <div class="bg-gray-900/95 border border-white/10 rounded-2xl overflow-hidden shadow-2xl backdrop-blur-xl">
            <div class="grid md:grid-cols-5 gap-0">
                <!-- Image column -->
                <div class="md:col-span-2 relative">
                    <img src="" alt="" data-speaker-modal-image class="w-full h-full object-cover min-h-[300px] md:min-h-full">
                    <div class="absolute top-4 left-4">
                        <span class="badge badge-warning d-none" data-speaker-modal-featured>
                            <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                            </svg>
                            Featured
                        </span>
                    </div>
                </div>
                
                <!-- Content column -->
                <div class="md:col-span-3 p-6 md:p-8">
                    <div class="subtitle mb-2 text-primary-400">Speaker Profile</div>
                    <h2 id="speakerProfileModalLabel" class="text-2xl md:text-3xl font-bold text-white mb-2" data-speaker-modal-name></h2>
                    <p class="text-gray-300 text-lg mb-4" data-speaker-modal-role></p>
                    <p class="text-gray-400 text-sm mb-6" data-speaker-modal-country></p>

                    <!-- Social links -->
                    <div class="speaker-modal-socials flex flex-wrap gap-2 mb-6" data-speaker-modal-socials></div>

                    <!-- Expertise -->
                    <div class="speaker-modal-expertise mb-6">
                        <h5 class="text-white font-semibold mb-3">Expertise</h5>
                        <div class="flex flex-wrap gap-2" data-speaker-modal-expertise></div>
                    </div>

                    <!-- Biography -->
                    <div class="speaker-modal-biography">
                        <h5 class="text-white font-semibold mb-3">Biography</h5>
                        <div class="text-gray-300" data-speaker-modal-biography></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
