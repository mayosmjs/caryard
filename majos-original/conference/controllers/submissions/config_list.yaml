# ===================================
#  List Behavior Config
# ===================================

# Model Class name
modelClass: Majos\Conference\Models\Submission

# List Title
title: Manage Submissions

# Model List Column configuration
list: $/majos/conference/models/submission/columns.yaml

# Link URL for each record
recordUrl: majos/conference/submissions/preview/:id

# Message to display if the list is empty
noRecordsMessage: No submissions found

# Records to display per page
recordsPerPage: 30

# Display page numbers with pagination, disable to improve performance
showPageNumbers: true

# Displays the list column set up button
showSetup: true

# Displays the sorting link on each column
showSorting: true

# Default sorting column
defaultSort:
    column: created_at
    direction: desc

# Display checkboxes next to each record
showCheckboxes: true

# Toolbar widget configuration
toolbar:
    # Partial for toolbar buttons
    buttons: list_toolbar

    # Search widget configuration
    search:
        prompt: Search submissions

    # Filter widget configuration
    filter: config_filter

# Filter configuration
filter:
    scopes:
        status:
            label: Status
            type: group
            conditions: status in (:value)
            options:
                submitted: Submitted
                accepted: Accepted
                rejected: Rejected
            default: submitted
        category:
            label: Category
            type: group
            conditions: category in (:value)
            options:
                'Artificial Intelligence': Artificial Intelligence
                'Brachytherapy': Brachytherapy
                'Nuclear Medicine': Nuclear Medicine
                'Particle Therapy': Particle Therapy
                'Quality Assurance': Quality Assurance
                'Radiation Biology': Radiation Biology
                'Radiation Imaging': Radiation Imaging
                'Radiation Protection': Radiation Protection
                'Radiation Therapy': Radiation Therapy
                'Others': Others